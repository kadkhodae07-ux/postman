name: Build Latest Postyar Source ZIP

on:
  push:
    branches:
      - main
      - master
    paths:
      - '*.zip'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: postyar-android-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-postyar-apk:
    name: Build one Postyar APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      APP_ARTIFACT_NAME: Postyar-Android
      APK_FILE_NAME: Postyar-release.apk
      LOG_ARTIFACT_PREFIX: Postyar-Build-Logs
      REQUIRED_GRADLE_VERSION: '8.14.3'
      WORKFLOW_REVISION: postyar-wf6-global-gradle-2026-08-04

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize diagnostics workspace
        id: init
        run: |
          set -Eeuo pipefail

          LOG_DIR="$RUNNER_TEMP/postyar-logs"
          SOURCE_DIR="$RUNNER_TEMP/postyar-source"
          OUTPUT_DIR="$RUNNER_TEMP/postyar-output"
          export LOG_DIR SOURCE_DIR OUTPUT_DIR

          {
            echo "LOG_DIR=$LOG_DIR"
            echo "SOURCE_DIR=$SOURCE_DIR"
            echo "OUTPUT_DIR=$OUTPUT_DIR"
          } >> "$GITHUB_ENV"

          rm -rf "$LOG_DIR" "$SOURCE_DIR" "$OUTPUT_DIR"
          mkdir -p "$LOG_DIR" "$SOURCE_DIR" "$OUTPUT_DIR"

          {
            echo "Workflow: ${GITHUB_WORKFLOW}"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo "Ref: ${GITHUB_REF}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "Runner OS: ${RUNNER_OS}"
            echo "Runner arch: ${RUNNER_ARCH}"
            echo "Started UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Workflow revision: $WORKFLOW_REVISION"
            echo "Required Gradle: $REQUIRED_GRADLE_VERSION"
          } | tee "$LOG_DIR/run-info.txt"

          if [[ -f "$GITHUB_WORKSPACE/.github/workflows/build-android.yml" ]]; then
            cp "$GITHUB_WORKSPACE/.github/workflows/build-android.yml" \
              "$LOG_DIR/workflow-build-android.yml"
            sha256sum "$GITHUB_WORKSPACE/.github/workflows/build-android.yml" \
              | tee "$LOG_DIR/workflow-sha256.txt"
          fi

          git status --short --branch \
            | tee "$LOG_DIR/git-status.txt"

          git log -10 --date=iso-strict --pretty=format:'%h %ad %an %s' \
            | tee "$LOG_DIR/recent-commits.txt"

      - name: Select latest valid Flutter source ZIP and extract safely
        id: project
        run: |
          set -Eeuo pipefail

          LOG="$LOG_DIR/source-selection.log"
          export LOG

          trap 'status=$?; {
            echo;
            echo "ERROR: source selection failed";
            echo "Exit code: $status";
            echo "Line: $LINENO";
            echo "Command: $BASH_COMMAND";
          } | tee -a "$LOG"; exit "$status"' ERR

          python3 <<'PY' 2>&1 | tee "$LOG"
          import os
          import re
          import stat
          import shutil
          import subprocess
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          source_dir = Path(os.environ["SOURCE_DIR"]).resolve()
          github_output = Path(os.environ["GITHUB_OUTPUT"])
          log_dir = Path(os.environ["LOG_DIR"]).resolve()

          def natural_key(value: str):
              return [int(part) if part.isdigit() else part.lower()
                      for part in re.split(r"(\d+)", value)]

          def git_commit_time(path: Path) -> int:
              relative = path.relative_to(workspace).as_posix()
              result = subprocess.run(
                  ["git", "-C", str(workspace), "log", "-1", "--format=%ct", "--", relative],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              value = result.stdout.strip()
              if value.isdigit():
                  return int(value)
              return int(path.stat().st_mtime)

          def safe_member(info: zipfile.ZipInfo) -> bool:
              raw_name = info.filename.replace("\\", "/")
              path = PurePosixPath(raw_name)
              if not raw_name or raw_name.startswith("/"):
                  return False
              if re.match(r"^[A-Za-z]:", raw_name):
                  return False
              if any(part in ("", ".", "..") for part in path.parts):
                  return False
              unix_mode = (info.external_attr >> 16) & 0o170000
              if unix_mode == stat.S_IFLNK:
                  return False
              return True

          def valid_flutter_roots(archive: zipfile.ZipFile):
              infos = archive.infolist()
              names = [info.filename.replace("\\", "/") for info in infos]
              roots = []

              for name in names:
                  if not name.endswith("pubspec.yaml"):
                      continue

                  root = name[:-len("pubspec.yaml")].rstrip("/")
                  prefix = f"{root}/" if root else ""

                  has_lib = any(item.startswith(prefix + "lib/") for item in names)
                  has_android_app = any(
                      item.startswith(prefix + "android/app/") for item in names
                  )
                  if not (has_lib and has_android_app):
                      continue

                  try:
                      pubspec = archive.read(name).decode("utf-8", errors="replace")
                  except Exception:
                      continue

                  if not re.search(r"(?m)^\s*flutter\s*:\s*$", pubspec):
                      continue
                  if not re.search(r"(?ms)^dependencies\s*:.*?sdk\s*:\s*flutter\s*$", pubspec):
                      continue

                  roots.append(root)

              return sorted(set(roots), key=lambda item: (len(PurePosixPath(item).parts), item))

          def is_standalone_source_archive(archive: zipfile.ZipFile, project_root: str) -> bool:
              # A source ZIP may contain the Flutter project at ZIP root or inside one wrapper folder.
              # It must not be a multi-package bundle containing backend/docs/other products beside it.
              if not project_root:
                  return True

              prefix = project_root.rstrip("/") + "/"
              allowed_top_level_files = {
                  "readme", "readme.md", "readme.txt", "license", "license.md",
                  "changelog", "changelog.md", "sha256sums", "checksums.txt",
              }

              for info in archive.infolist():
                  name = info.filename.replace("\\", "/").lstrip("./")
                  if not name or name.startswith("__MACOSX/"):
                      continue
                  if name == project_root or name.startswith(prefix):
                      continue

                  path = PurePosixPath(name)
                  if len(path.parts) == 1 and path.name.lower() in allowed_top_level_files:
                      continue

                  return False

              return True

          candidates = []
          rejected = []

          zip_files = sorted(workspace.glob("*.zip"), key=lambda path: natural_key(path.name))
          print(f"ZIP files found in repository root: {len(zip_files)}")

          for zip_path in zip_files:
              try:
                  with zipfile.ZipFile(zip_path, "r") as archive:
                      bad_member = archive.testzip()
                      if bad_member:
                          rejected.append((zip_path.name, f"corrupt member: {bad_member}"))
                          continue

                      unsafe = [info.filename for info in archive.infolist() if not safe_member(info)]
                      if unsafe:
                          rejected.append((zip_path.name, f"unsafe ZIP member: {unsafe[0]}"))
                          continue

                      roots = valid_flutter_roots(archive)
                      if not roots:
                          rejected.append((zip_path.name, "no valid Flutter Android project"))
                          continue

                      project_root = roots[0]
                      if not is_standalone_source_archive(archive, project_root):
                          rejected.append((
                              zip_path.name,
                              "contains a Flutter project but is a multi-package bundle, not a standalone source ZIP",
                          ))
                          continue

                      commit_time = git_commit_time(zip_path)
                      candidates.append({
                          "path": zip_path,
                          "time": commit_time,
                          "root": project_root,
                          "roots": roots,
                      })
              except zipfile.BadZipFile:
                  rejected.append((zip_path.name, "invalid ZIP structure"))
              except Exception as exc:
                  rejected.append((zip_path.name, f"validation error: {exc}"))

          print("\nRejected ZIP files:")
          if rejected:
              for name, reason in rejected:
                  print(f"- {name}: {reason}")
          else:
              print("- none")

          print("\nEligible Flutter source ZIP files:")
          if candidates:
              for item in sorted(
                  candidates,
                  key=lambda item: (item["time"], natural_key(item["path"].name)),
                  reverse=True,
              ):
                  print(
                      f"- {item['path'].name} | commit_time={item['time']} "
                      f"| project_root={item['root'] or '.'}"
                  )
          else:
              print("- none")
              raise SystemExit(
                  "No valid Flutter source ZIP was found in the repository root. "
                  "The ZIP must directly contain a Flutter project with pubspec.yaml, lib/, and android/app/."
              )

          selected = max(
              candidates,
              key=lambda item: (item["time"], natural_key(item["path"].name)),
          )
          selected_zip = selected["path"]

          print(f"\nSelected source ZIP: {selected_zip.name}")
          print(f"Selected project root inside ZIP: {selected['root'] or '.'}")

          shutil.rmtree(source_dir, ignore_errors=True)
          source_dir.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(selected_zip, "r") as archive:
              for info in archive.infolist():
                  if not safe_member(info):
                      raise SystemExit(f"Unsafe ZIP member rejected during extraction: {info.filename}")
              archive.extractall(source_dir)

          project_dir = (source_dir / selected["root"]).resolve()
          try:
              project_dir.relative_to(source_dir)
          except ValueError as exc:
              raise SystemExit("Extracted project escaped the safe source directory") from exc

          required = [
              project_dir / "pubspec.yaml",
              project_dir / "lib",
              project_dir / "android" / "app",
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit("Required Flutter project paths are missing after extraction: " + ", ".join(missing))

          wrapper_properties = project_dir / "android" / "gradle" / "wrapper" / "gradle-wrapper.properties"
          if not wrapper_properties.is_file():
              raise SystemExit("android/gradle/wrapper/gradle-wrapper.properties is missing")

          wrapper_text = wrapper_properties.read_text(encoding="utf-8", errors="replace")
          match = re.search(r"gradle-([0-9][0-9A-Za-z.+-]*)-(?:bin|all)\.zip", wrapper_text)
          if not match:
              raise SystemExit("Could not determine Gradle version from gradle-wrapper.properties")
          gradle_version = match.group(1)

          selected_hash = subprocess.run(
              ["sha256sum", str(selected_zip)],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          (log_dir / "selected-source-sha256.txt").write_text(selected_hash + "\n", encoding="utf-8")

          with zipfile.ZipFile(selected_zip, "r") as archive:
              listing = "\n".join(
                  f"{info.file_size:>12}  {info.filename}" for info in archive.infolist()
              )
          (log_dir / "selected-source-contents.txt").write_text(listing + "\n", encoding="utf-8")

          outputs = {
              "dir": str(project_dir),
              "zip": selected_zip.name,
              "zip_path": str(selected_zip),
              "project_root": selected["root"] or ".",
              "gradle_version": gradle_version,
          }
          with github_output.open("a", encoding="utf-8") as stream:
              for key, value in outputs.items():
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"Unsafe newline in output {key}")
                  stream.write(f"{key}={value}\n")

          print(f"Extracted project directory: {project_dir}")
          print(f"Gradle version requested by source: {gradle_version}")
          print(f"Selected ZIP SHA-256: {selected_hash.split()[0]}")
          PY

          test -f "${{ steps.project.outputs.dir }}/pubspec.yaml"
          test -d "${{ steps.project.outputs.dir }}/android/app"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up exact Gradle 8.14.3
        id: gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.REQUIRED_GRADLE_VERSION }}
          cache-cleanup: on-success
          add-job-summary: on-failure

      - name: Record complete build environment
        run: |
          set -Eeuo pipefail

          LOG="$LOG_DIR/environment.log"
          trap 'status=$?; {
            echo;
            echo "Environment inspection failed with exit code $status";
            echo "Line: $LINENO";
            echo "Command: $BASH_COMMAND";
          } | tee -a "$LOG"; exit "$status"' ERR

          {
            echo '=== Date UTC ==='
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            echo

            echo '=== Runner ==='
            uname -a
            cat /etc/os-release
            echo

            echo '=== Disk ==='
            df -h
            echo

            echo '=== Memory ==='
            free -h
            echo

            echo '=== Java ==='
            java -version
            echo "JAVA_HOME=$JAVA_HOME"
            echo

            echo '=== Flutter ==='
            flutter --version
            flutter doctor -v
            echo

            echo '=== Dart ==='
            dart --version
            echo

            echo '=== Gradle installed by setup-gradle ==='
            echo "Requested Gradle: $REQUIRED_GRADLE_VERSION"
            echo "Action output Gradle: ${{ steps.gradle.outputs.gradle-version }}"
            echo "Gradle executable: $(command -v gradle || true)"
            gradle --version
            echo

            ACTUAL_GRADLE_VERSION="$(gradle --version | awk '/^Gradle / {print $2; exit}')"
            if [[ "$ACTUAL_GRADLE_VERSION" != "$REQUIRED_GRADLE_VERSION" ]]; then
              echo "ERROR: setup-gradle did not activate the required Gradle version."
              echo "Required: $REQUIRED_GRADLE_VERSION"
              echo "Actual:   ${ACTUAL_GRADLE_VERSION:-unknown}"
              exit 1
            fi

            echo '=== Android SDK ==='
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            if command -v sdkmanager >/dev/null 2>&1; then
              sdkmanager --list_installed || true
            fi
          } 2>&1 | tee "$LOG"

      - name: Validate project and record Android configuration
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail

          LOG="$LOG_DIR/project-validation.log"
          trap 'status=$?; {
            echo;
            echo "Project validation failed with exit code $status";
            echo "Line: $LINENO";
            echo "Command: $BASH_COMMAND";
          } | tee -a "$LOG"; exit "$status"' ERR

          {
            echo "Project directory: $PWD"
            echo "Source ZIP: ${{ steps.project.outputs.zip }}"
            echo

            echo '=== Required files ==='
            test -f pubspec.yaml
            test -d lib
            test -d android/app
            test -f android/settings.gradle -o -f android/settings.gradle.kts
            test -f android/app/build.gradle -o -f android/app/build.gradle.kts
            test -f android/gradle/wrapper/gradle-wrapper.properties
            echo 'Required project structure is present.'
            echo

            echo '=== Pubspec version ==='
            grep -E '^version:' pubspec.yaml || true
            echo

            echo '=== Gradle wrapper properties ==='
            cat android/gradle/wrapper/gradle-wrapper.properties
            echo

            echo '=== Android Gradle Plugin and Kotlin declarations ==='
            grep -RInE \
              'com\.android\.(application|tools\.build:gradle)|org\.jetbrains\.kotlin|kotlin-gradle-plugin' \
              android/settings.gradle android/settings.gradle.kts \
              android/build.gradle android/build.gradle.kts \
              2>/dev/null || true
            echo

            echo '=== Project tree ==='
            find . -maxdepth 4 -type f \
              -not -path './.dart_tool/*' \
              -not -path './build/*' \
              -not -path './.git/*' \
              -printf '%p\n' | sort
          } 2>&1 | tee "$LOG"

      - name: Prepare Flutter dependencies and Persian OCR model
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail

          LOG="$LOG_DIR/prepare.log"
          exec > >(tee -a "$LOG") 2>&1
          trap 'status=$?; {
            echo;
            echo "Dependency preparation failed with exit code $status";
            echo "Line: $LINENO";
            echo "Command: $BASH_COMMAND";
          }; exit "$status"' ERR

          retry_command() {
            local attempts="$1"
            local delay="$2"
            shift 2
            local try=1

            until "$@"; do
              local status=$?
              if (( try >= attempts )); then
                echo "Command failed after ${try} attempts with exit code ${status}: $*"
                return "$status"
              fi
              echo "Attempt ${try}/${attempts} failed with exit code ${status}: $*"
              echo "Retrying in ${delay} seconds..."
              sleep "$delay"
              try=$((try + 1))
              delay=$((delay * 2))
            done
          }

          rm -rf build .dart_tool
          flutter clean

          if [[ -f tool/fetch_ocr_model.sh ]]; then
            chmod +x tool/fetch_ocr_model.sh
            retry_command 3 10 bash tool/fetch_ocr_model.sh
          else
            echo 'No OCR download script found; using assets already present in the source.'
          fi

          if grep -q 'assets/tessdata/' pubspec.yaml; then
            if [[ ! -s assets/tessdata/fas.traineddata ]]; then
              echo 'Persian OCR model is declared but assets/tessdata/fas.traineddata is missing or empty.'
              exit 1
            fi
            echo "Persian OCR model size: $(stat -c '%s' assets/tessdata/fas.traineddata) bytes"
            sha256sum assets/tessdata/fas.traineddata
          fi

          retry_command 3 10 flutter pub get

          echo
          echo '=== Resolved dependencies ==='
          flutter pub deps --style=compact

          echo
          echo '=== Generated local.properties ==='
          if [[ -f android/local.properties ]]; then
            sed -E 's#^(sdk\.dir|flutter\.sdk)=.*#\1=<runner-path>#' android/local.properties
          else
            echo 'android/local.properties has not been generated yet.'
          fi

      - name: Enforce exact global Gradle and prepare release properties
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail

          LOG="$LOG_DIR/gradle-version.log"
          exec > >(tee -a "$LOG") 2>&1
          trap 'status=$?; {
            echo;
            echo "Gradle enforcement failed with exit code $status";
            echo "Line: $LINENO";
            echo "Command: $BASH_COMMAND";
          }; exit "$status"' ERR

          echo "Workflow revision: $WORKFLOW_REVISION"
          echo "Required global Gradle: $REQUIRED_GRADLE_VERSION"
          echo "Gradle executable: $(command -v gradle)"
          gradle --version

          ACTUAL_GRADLE_VERSION="$(gradle --version | awk '/^Gradle / {print $2; exit}')"
          if [[ "$ACTUAL_GRADLE_VERSION" != "$REQUIRED_GRADLE_VERSION" ]]; then
            echo "ERROR: Required Gradle $REQUIRED_GRADLE_VERSION but active Gradle is ${ACTUAL_GRADLE_VERSION:-unknown}."
            exit 1
          fi

          WRAPPER_PROPERTIES=android/gradle/wrapper/gradle-wrapper.properties
          WRAPPER_JAR=android/gradle/wrapper/gradle-wrapper.jar

          echo
          echo '=== Source wrapper state ==='
          if [[ -f "$WRAPPER_PROPERTIES" ]]; then
            cat "$WRAPPER_PROPERTIES"
          else
            echo 'gradle-wrapper.properties is missing.'
          fi

          if [[ -s "$WRAPPER_JAR" ]]; then
            echo "Wrapper JAR exists: $(stat -c '%s' "$WRAPPER_JAR") bytes"
          else
            echo 'Wrapper JAR is missing or empty. This workflow intentionally bypasses gradlew.'
          fi

          # Flutter can regenerate a missing wrapper with its template Gradle version.
          # The release is therefore built with the exact setup-gradle executable, not ./gradlew.
          rm -f android/gradlew android/gradlew.bat
          rm -f "$WRAPPER_JAR"

          PUBSPEC_VERSION="$(awk '/^version:[[:space:]]*/ {print $2; exit}' pubspec.yaml)"
          VERSION_NAME="${PUBSPEC_VERSION%%+*}"
          if [[ "$PUBSPEC_VERSION" == *+* ]]; then
            VERSION_CODE="${PUBSPEC_VERSION##*+}"
          else
            VERSION_CODE=1
          fi

          if [[ -z "$VERSION_NAME" || ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "Invalid pubspec version: ${PUBSPEC_VERSION:-missing}"
            exit 1
          fi

          export VERSION_NAME VERSION_CODE
          touch android/local.properties
          python3 - <<'PY_RELEASE_PROPERTIES'
          import os
          from pathlib import Path

          path = Path('android/local.properties')
          existing = {}
          order = []
          if path.exists():
              for raw in path.read_text(encoding='utf-8', errors='replace').splitlines():
                  if '=' in raw and not raw.lstrip().startswith('#'):
                      key, value = raw.split('=', 1)
                      key = key.strip()
                      if key not in existing:
                          order.append(key)
                      existing[key] = value.strip()

          updates = {
              'flutter.buildMode': 'release',
              'flutter.versionName': os.environ['VERSION_NAME'],
              'flutter.versionCode': os.environ['VERSION_CODE'],
          }
          for key, value in updates.items():
              if key not in existing:
                  order.append(key)
              existing[key] = value

          path.write_text(''.join(f'{key}={existing[key]}\n' for key in order), encoding='utf-8')
          PY_RELEASE_PROPERTIES

          echo
          echo "Release version name: $VERSION_NAME"
          echo "Release version code: $VERSION_CODE"
          echo '=== local.properties (paths masked) ==='
          sed -E 's#^(sdk\.dir|flutter\.sdk)=.*#\1=<runner-path>#' android/local.properties

      - name: Analyze Flutter source
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail

          LOG="$LOG_DIR/flutter-analyze.log"
          trap 'status=$?; {
            echo;
            echo "Flutter analyze failed with exit code $status";
            echo "Line: $LINENO";
            echo "Command: $BASH_COMMAND";
          } | tee -a "$LOG"; exit "$status"' ERR

          flutter analyze --no-fatal-infos --no-fatal-warnings \
            2>&1 | tee "$LOG"

      - name: Build exactly one release APK
        id: build
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -Eeuo pipefail

          LOG="$LOG_DIR/flutter-build-apk.log"
          exec > >(tee -a "$LOG") 2>&1
          trap 'status=$?; {
            echo;
            echo "Flutter APK build failed with exit code $status";
            echo "Line: $LINENO";
            echo "Command: $BASH_COMMAND";
          }; exit "$status"' ERR

          rm -rf build/app/outputs/flutter-apk
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          echo "Building with exact global Gradle $REQUIRED_GRADLE_VERSION"
          echo "Gradle executable: $(command -v gradle)"
          gradle --version

          ACTUAL_GRADLE_VERSION="$(gradle --version | awk '/^Gradle / {print $2; exit}')"
          if [[ "$ACTUAL_GRADLE_VERSION" != "$REQUIRED_GRADLE_VERSION" ]]; then
            echo "ERROR: Build blocked because active Gradle is ${ACTUAL_GRADLE_VERSION:-unknown}, not $REQUIRED_GRADLE_VERSION."
            exit 1
          fi

          # Do not call `flutter build apk` here. With an incomplete source wrapper,
          # Flutter may regenerate Gradle 8.10.2. The Flutter Gradle plugin is invoked
          # directly by the exact Gradle distribution installed above.
          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            -p android \
            :app:assembleRelease

          echo
          echo '=== APK candidates produced by Gradle ==='
          mapfile -d '' produced_apks < <(
            find build android/app/build \
              -type f \
              -iname '*release*.apk' \
              -print0 2>/dev/null || true
          )

          if [[ ${#produced_apks[@]} -eq 0 ]]; then
            echo 'No release APK was produced.'
            find build android/app/build -maxdepth 10 -type f -printf '%p %s bytes\n' 2>/dev/null || true
            exit 1
          fi

          printf '%s\n' "${produced_apks[@]}"

          EXPECTED_APK=''
          preferred_paths=(
            'build/app/outputs/flutter-apk/app-release.apk'
            'build/app/outputs/apk/release/app-release.apk'
            'android/app/build/outputs/apk/release/app-release.apk'
          )
          for candidate in "${preferred_paths[@]}"; do
            if [[ -s "$candidate" ]]; then
              EXPECTED_APK="$candidate"
              break
            fi
          done

          if [[ -z "$EXPECTED_APK" ]]; then
            EXPECTED_APK="${produced_apks[0]}"
          fi

          if [[ ! -s "$EXPECTED_APK" ]]; then
            echo "Release APK is missing or empty: $EXPECTED_APK"
            exit 1
          fi

          echo '=== Internal release APK hashes ==='
          for candidate in "${produced_apks[@]}"; do
            sha256sum "$candidate"
          done

          # Gradle or the Flutter Gradle plugin may keep internal copies in different
          # build folders. Only the selected canonical APK is copied to OUTPUT_DIR,
          # so the uploaded artifact still contains exactly one APK.
          echo "Selected release APK: $EXPECTED_APK"

          APK_SIZE="$(stat -c '%s' "$EXPECTED_APK")"
          if (( APK_SIZE < 100000 )); then
            echo "APK is unexpectedly small: ${APK_SIZE} bytes"
            exit 1
          fi

          unzip -t "$EXPECTED_APK"

          if ! unzip -Z1 "$EXPECTED_APK" | grep -qx 'AndroidManifest.xml'; then
            echo 'APK validation failed: AndroidManifest.xml is missing.'
            exit 1
          fi

          if ! unzip -Z1 "$EXPECTED_APK" | grep -Eq '(^|/)classes([0-9]*)?\.dex$'; then
            echo 'APK validation failed: no classes.dex file was found.'
            exit 1
          fi

          cp "$EXPECTED_APK" "$OUTPUT_DIR/$APK_FILE_NAME"

          OUTPUT_APK_COUNT="$(find "$OUTPUT_DIR" -maxdepth 1 -type f -iname '*.apk' | wc -l | tr -d ' ')"
          OUTPUT_FILE_COUNT="$(find "$OUTPUT_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')"

          if [[ "$OUTPUT_APK_COUNT" != '1' || "$OUTPUT_FILE_COUNT" != '1' ]]; then
            echo "Final output directory must contain exactly one file and it must be one APK."
            echo "Files: $OUTPUT_FILE_COUNT | APK files: $OUTPUT_APK_COUNT"
            find "$OUTPUT_DIR" -maxdepth 1 -type f -printf '%p %s bytes\n'
            exit 1
          fi

          FINAL_APK="$OUTPUT_DIR/$APK_FILE_NAME"
          FINAL_SIZE="$(stat -c '%s' "$FINAL_APK")"
          FINAL_SHA256="$(sha256sum "$FINAL_APK" | awk '{print $1}')"

          {
            echo "file=$APK_FILE_NAME"
            echo "size_bytes=$FINAL_SIZE"
            echo "sha256=$FINAL_SHA256"
          } >> "$GITHUB_OUTPUT"

          {
            echo "APK file: $APK_FILE_NAME"
            echo "APK size: $FINAL_SIZE bytes"
            echo "APK SHA-256: $FINAL_SHA256"
          } | tee "$LOG_DIR/apk-verification.txt"

      - name: Upload new APK before deleting any old output
        id: upload_apk
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/postyar-output/${{ env.APK_FILE_NAME }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Verify uploaded APK artifact through GitHub API
        id: verify_artifact
        uses: actions/github-script@v9
        env:
          CURRENT_ARTIFACT_ID: ${{ steps.upload_apk.outputs.artifact-id }}
          EXPECTED_ARTIFACT_NAME: ${{ env.APP_ARTIFACT_NAME }}
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const artifactId = Number(process.env.CURRENT_ARTIFACT_ID);
            const expectedName = process.env.EXPECTED_ARTIFACT_NAME;

            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              core.setFailed(`upload-artifact returned an invalid artifact ID: ${process.env.CURRENT_ARTIFACT_ID}`);
              return;
            }

            const response = await github.rest.actions.getArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifactId,
            });

            const artifact = response.data;

            if (artifact.id !== artifactId) {
              core.setFailed(`Artifact ID mismatch. Expected ${artifactId}, received ${artifact.id}`);
              return;
            }

            if (artifact.name !== expectedName) {
              core.setFailed(`Artifact name mismatch. Expected ${expectedName}, received ${artifact.name}`);
              return;
            }

            if (artifact.expired) {
              core.setFailed(`Newly uploaded artifact ${artifactId} is unexpectedly marked as expired.`);
              return;
            }

            if (!artifact.size_in_bytes || artifact.size_in_bytes <= 0) {
              core.setFailed(`Newly uploaded artifact ${artifactId} has an invalid size: ${artifact.size_in_bytes}`);
              return;
            }

            const currentRunId = Number(context.runId);
            if (artifact.workflow_run?.id && Number(artifact.workflow_run.id) !== currentRunId) {
              core.setFailed(
                `Artifact belongs to workflow run ${artifact.workflow_run.id}, not current run ${currentRunId}.`
              );
              return;
            }

            core.info(`Verified new artifact ${artifact.name} (${artifact.id}), size=${artifact.size_in_bytes} bytes.`);
            core.setOutput('artifact_id', String(artifact.id));
            core.setOutput('artifact_size', String(artifact.size_in_bytes));
            core.setOutput('artifact_url', artifact.archive_download_url || '');

      - name: Delete previous Postyar APK and diagnostic artifacts
        id: cleanup
        uses: actions/github-script@v9
        env:
          CURRENT_ARTIFACT_ID: ${{ steps.upload_apk.outputs.artifact-id }}
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,410,422
          script: |
            const currentArtifactId = Number(process.env.CURRENT_ARTIFACT_ID);

            if (!Number.isSafeInteger(currentArtifactId) || currentArtifactId <= 0) {
              core.setFailed(`Invalid current artifact ID: ${process.env.CURRENT_ARTIFACT_ID}`);
              return;
            }

            const isPostyarArtifact = (artifact) => {
              const name = String(artifact.name || '').toLowerCase();
              return (
                name === 'postyar-android' ||
                name.startsWith('postyar-android-') ||
                name.startsWith('postyar-build-logs') ||
                name.startsWith('postyar-apk') ||
                name.startsWith('postyar-release')
              );
            };

            let artifacts = [];
            let currentArtifact = null;

            for (let attempt = 1; attempt <= 5; attempt += 1) {
              artifacts = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100,
                }
              );

              currentArtifact = artifacts.find((artifact) => artifact.id === currentArtifactId);
              if (currentArtifact) {
                break;
              }

              core.info(`Artifact visibility check ${attempt}/5: current artifact is not visible yet.`);
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }

            if (!currentArtifact) {
              core.setFailed(
                `The newly uploaded artifact ${currentArtifactId} is not visible in the repository artifact list. ` +
                `Old outputs were not deleted.`
              );
              return;
            }

            const oldArtifacts = artifacts
              .filter(isPostyarArtifact)
              .filter((artifact) => artifact.id !== currentArtifactId)
              .sort((left, right) => new Date(left.created_at) - new Date(right.created_at));

            core.info(`Found ${oldArtifacts.length} previous Postyar artifacts to delete.`);

            const deleted = [];
            const failures = [];

            for (const artifact of oldArtifacts) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted.push({ id: artifact.id, name: artifact.name });
                core.info(`Deleted old artifact: ${artifact.name} (${artifact.id})`);
              } catch (error) {
                if (error.status === 404 || error.status === 410) {
                  core.warning(`Artifact ${artifact.id} is already deleted or unavailable.`);
                  continue;
                }
                failures.push({
                  id: artifact.id,
                  name: artifact.name,
                  status: error.status,
                  message: error.message,
                });
                core.error(`Failed to delete ${artifact.name} (${artifact.id}): ${error.message}`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(
                `New APK was uploaded safely, but ${failures.length} old artifact(s) could not be deleted: ` +
                JSON.stringify(failures)
              );
              return;
            }

            // Confirm that only the current APK artifact remains among Postyar artifacts.
            let remainingOld = [];
            for (let attempt = 1; attempt <= 5; attempt += 1) {
              const refreshed = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100,
                }
              );

              remainingOld = refreshed
                .filter(isPostyarArtifact)
                .filter((artifact) => artifact.id !== currentArtifactId);

              if (remainingOld.length === 0) {
                break;
              }

              core.info(
                `Cleanup verification attempt ${attempt}/5: ${remainingOld.length} old artifact(s) still visible.`
              );
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }

            if (remainingOld.length > 0) {
              core.setFailed(
                `Artifact cleanup verification failed. Remaining old artifacts: ` +
                remainingOld.map((artifact) => `${artifact.name} (${artifact.id})`).join(', ')
              );
              return;
            }

            core.info(`Cleanup complete. Preserved current APK artifact ${currentArtifactId}.`);
            core.setOutput('deleted_count', String(deleted.length));

      - name: Collect complete failure diagnostics
        if: failure()
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          SELECTED_ZIP: ${{ steps.project.outputs.zip }}
        run: |
          set +e

          mkdir -p "$LOG_DIR"

          {
            echo "Failure collection UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Job status: ${{ job.status }}"
            echo "Selected ZIP: ${SELECTED_ZIP:-not-selected}"
            echo "Project directory: ${PROJECT_DIR:-not-selected}"
            echo
            echo '=== Disk ==='
            df -h
            echo
            echo '=== Memory ==='
            free -h
            echo
            echo '=== Processes ==='
            ps aux --sort=-%mem | head -n 80
          } > "$LOG_DIR/failure-system-state.txt" 2>&1

          {
            echo '=== Git status ==='
            git -C "$GITHUB_WORKSPACE" status --short --branch
            echo
            echo '=== Root files ==='
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          } > "$LOG_DIR/failure-repository-state.txt" 2>&1

          if [[ -n "${PROJECT_DIR:-}" && -d "$PROJECT_DIR" ]]; then
            DIAGNOSTICS="$LOG_DIR/project-files"
            mkdir -p "$DIAGNOSTICS"

            files=(
              pubspec.yaml
              pubspec.lock
              analysis_options.yaml
              android/gradle.properties
              android/settings.gradle
              android/settings.gradle.kts
              android/build.gradle
              android/build.gradle.kts
              android/app/build.gradle
              android/app/build.gradle.kts
              android/app/src/main/AndroidManifest.xml
              android/gradle/wrapper/gradle-wrapper.properties
              assets/tessdata_config.json
            )

            for file in "${files[@]}"; do
              if [[ -f "$PROJECT_DIR/$file" ]]; then
                mkdir -p "$DIAGNOSTICS/$(dirname "$file")"
                cp "$PROJECT_DIR/$file" "$DIAGNOSTICS/$file"
              fi
            done

            {
              echo '=== Project file tree ==='
              find "$PROJECT_DIR" -maxdepth 7 -type f \
                -not -path '*/.dart_tool/*' \
                -not -path '*/.gradle/*' \
                -not -path '*/assets/tessdata/fas.traineddata' \
                -printf '%p %s bytes\n' | sort
              echo
              echo '=== Build outputs ==='
              find "$PROJECT_DIR/build" -maxdepth 10 -type f -printf '%p %s bytes\n' 2>/dev/null | sort
            } > "$LOG_DIR/project-tree-and-outputs.txt" 2>&1

            if [[ -d "$PROJECT_DIR/build/app/outputs/logs" ]]; then
              mkdir -p "$DIAGNOSTICS/build/app/outputs"
              cp -R "$PROJECT_DIR/build/app/outputs/logs" \
                "$DIAGNOSTICS/build/app/outputs/"
            fi

            if [[ -d "$PROJECT_DIR/android/app/build/reports" ]]; then
              mkdir -p "$DIAGNOSTICS/android/app/build"
              cp -R "$PROJECT_DIR/android/app/build/reports" \
                "$DIAGNOSTICS/android/app/build/"
            fi
          fi

          find "$LOG_DIR" -type f -printf '%p %s bytes\n' \
            | sort > "$LOG_DIR/diagnostic-manifest.txt"

      - name: Upload failure log package
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.LOG_ARTIFACT_PREFIX }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postyar-logs/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          include-hidden-files: true

      - name: Write final build summary
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          SOURCE_ZIP: ${{ steps.project.outputs.zip }}
          APK_SIZE: ${{ steps.build.outputs.size_bytes }}
          APK_SHA256: ${{ steps.build.outputs.sha256 }}
          ARTIFACT_ID: ${{ steps.upload_apk.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload_apk.outputs.artifact-url }}
          DELETED_COUNT: ${{ steps.cleanup.outputs.deleted_count }}
        run: |
          {
            echo '# Postyar Android Build'
            echo
            echo "- Result: **${BUILD_STATUS}**"
            echo "- Source ZIP: \`${SOURCE_ZIP:-not-selected}\`"
            echo "- Workflow run: \`${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}\`"
            echo

            if [[ "$BUILD_STATUS" == 'success' ]]; then
              echo '## Output'
              echo
              echo "- Artifact: \`${APP_ARTIFACT_NAME}\`"
              echo "- APK: \`${APK_FILE_NAME}\`"
              echo "- APK count: **1**"
              echo "- APK size: \`${APK_SIZE:-unknown} bytes\`"
              echo "- APK SHA-256: \`${APK_SHA256:-unknown}\`"
              echo "- Artifact ID: \`${ARTIFACT_ID:-unknown}\`"
              echo "- Previous artifacts deleted: \`${DELETED_COUNT:-0}\`"
              if [[ -n "${ARTIFACT_URL:-}" ]]; then
                echo "- Download: ${ARTIFACT_URL}"
              fi
              echo
              echo 'The new APK was uploaded and verified before previous Postyar artifacts were deleted.'
            else
              echo '## Failure diagnostics'
              echo
              echo "- Artifact: \`${LOG_ARTIFACT_PREFIX}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}\`"
              echo '- Old artifacts are never deleted before a new APK is uploaded and verified. See diagnostics if failure occurred during cleanup.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
