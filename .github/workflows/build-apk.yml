name: Build Post Management APK v46

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.zip"
      - "pubspec.yaml"
      - "lib/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: post-management-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Flutter project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "pubspec.yaml" ]; then
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP_FILE=""
          while IFS= read -r candidate; do
            if unzip -Z1 "$candidate" 2>/dev/null | grep -qE '(^|/)pubspec\.yaml$'; then
              ZIP_FILE="$candidate"
              break
            fi
          done < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP containing a Flutter pubspec.yaml was found."
            exit 1
          fi
          echo "Using newest Flutter ZIP: $ZIP_FILE"
          rm -rf _extracted_flutter
          mkdir -p _extracted_flutter
          unzip -q "$ZIP_FILE" -d _extracted_flutter

          PUBSPEC="$(find _extracted_flutter -type f -name pubspec.yaml -print -quit || true)"
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml was not found inside ZIP."
            find _extracted_flutter -maxdepth 4 -type f | head -n 120 || true
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"
          echo "find_flutter_project=ok" >> "$RUNNER_TEMP/post-workflow-stages.log"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Verify preinstalled Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID SDK ROOT: $SDK_ROOT"
          echo "Installed Android platforms:"
          ls -1 "$SDK_ROOT/platforms" || true
          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ]; then
            echo "::error::android-35 is not preinstalled on this runner image."
            echo "::error::Expected: $SDK_ROOT/platforms/android-35/android.jar"
            exit 1
          fi
          echo "android-35 is available; no sdkmanager install or license mutation is required."
          echo "verify_android_sdk_35=ok" >> "$RUNNER_TEMP/post-workflow-stages.log"

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          HAD_TEST_DIR=0
          if [ -d "test" ]; then
            HAD_TEST_DIR=1
          fi

          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            flutter create --platforms=android --org ir.postmanagement --project-name post_management_sms_flutter .
          fi

          # flutter create generates a default widget_test.dart that targets MyApp.
          # This source intentionally ships without tests, so remove only tests created by flutter create.
          if [ "$HAD_TEST_DIR" -eq 0 ]; then
            rm -rf test
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit('AndroidManifest.xml not found')
          text = manifest.read_text()
          permissions = [
              'android.permission.INTERNET',
              'android.permission.READ_CONTACTS',
              'android.permission.WRITE_CONTACTS',
              'android.permission.RECEIVE_SMS',
          ]
          for perm in permissions:
              if f'android:name="{perm}"' not in text:
                  text = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="'+perm+r'" />', text, count=1)

          text = re.sub(r'<application\b([^>]*)>', lambda m: '<application'+(
              m.group(1)
              if 'android:allowBackup=' in m.group(1)
              else m.group(1)+' android:allowBackup="false"'
          )+'>', text, count=1)
          if 'android:usesCleartextTraffic=' not in text:
              text = re.sub(r'<application\b([^>]*)>', r'<application\1 android:usesCleartextTraffic="false">', text, count=1)

          receiver = '''\n        <receiver\n            android:name="com.shounakmulay.telephony.sms.IncomingSmsReceiver"\n            android:permission="android.permission.BROADCAST_SMS"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.provider.Telephony.SMS_RECEIVED" />\n            </intent-filter>\n        </receiver>\n'''
          if 'com.shounakmulay.telephony.sms.IncomingSmsReceiver' not in text:
              text = text.replace('</application>', receiver+'    </application>')
          manifest.write_text(text)

          proguard = Path('android/app/proguard-rules.pro')
          rules = proguard.read_text() if proguard.exists() else ''
          required_rules = '''
          # google_mlkit_text_recognition supports optional scripts that are not bundled.
          # The app uses only TextRecognitionScript.latin, so these optional classes are intentionally absent.
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          '''
          if 'com.google.mlkit.vision.text.chinese' not in rules:
              rules = (rules.rstrip() + '\n' + required_rules.strip() + '\n').lstrip()
          proguard.write_text(rules)

          for gradle in [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]:
              if not gradle.exists():
                  continue
              g = gradle.read_text()

              # Plugins used by this project require compileSdk 35.
              g = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 35', g)
              g = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', g)
              g = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 35', g)
              g = re.sub(r'compileSdk\s*=\s*flutter\.compileSdk', 'compileSdk = 35', g)
              g = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 35', g)

              g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', g)
              g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', g)
              g = re.sub(r'minSdk\s*=\s*flutter\.minSdk', 'minSdk = 23', g)

              if gradle.name == 'build.gradle':
                  # Keep the release APK ARM64-only. This prevents native OCR/barcode
                  # libraries for armeabi-v7a/x86/x86_64 from being packed into one APK.
                  if "abiFilters 'arm64-v8a'" not in g and 'abiFilters "arm64-v8a"' not in g:
                      default_pat = r'(defaultConfig\s*\{)'
                      if not re.search(default_pat, g):
                          raise SystemExit('Groovy defaultConfig block not found')
                      g = re.sub(
                          default_pat,
                          r"\1\n        ndk { abiFilters 'arm64-v8a' }",
                          g,
                          count=1,
                      )

                  # Make our R8 rules effective for release builds.
                  if "'proguard-rules.pro'" not in g and '"proguard-rules.pro"' not in g:
                      marker = '    buildTypes {'
                      if marker not in g:
                          raise SystemExit('Groovy buildTypes block not found')
                      # Inject inside release block when present.
                      release_pat = r'(release\s*\{)'
                      if re.search(release_pat, g):
                          g = re.sub(
                              release_pat,
                              r"\1\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'",
                              g,
                              count=1,
                          )
                      else:
                          raise SystemExit('Groovy release buildType not found')

                  # R8 + resource shrinker remove unused Java/Kotlin/resources.
                  release_pat = r'(release\s*\{)'
                  if re.search(release_pat, g):
                      if not re.search(r'minifyEnabled\s+true', g):
                          g = re.sub(release_pat, r"\1\n            minifyEnabled true", g, count=1)
                      if not re.search(r'shrinkResources\s+true', g):
                          g = re.sub(release_pat, r"\1\n            shrinkResources true", g, count=1)
              else:
                  # ARM64-only native packaging for Kotlin DSL projects.
                  if 'abiFilters += listOf("arm64-v8a")' not in g:
                      default_pat = r'(defaultConfig\s*\{)'
                      if not re.search(default_pat, g):
                          raise SystemExit('Kotlin defaultConfig block not found')
                      g = re.sub(
                          default_pat,
                          r'\1\n        ndk { abiFilters += listOf("arm64-v8a") }',
                          g,
                          count=1,
                      )

                  if '"proguard-rules.pro"' not in g:
                      release_pat = r'(getByName\("release"\)\s*\{)'
                      create_pat = r'(release\s*\{)'
                      if re.search(release_pat, g):
                          g = re.sub(
                              release_pat,
                              r'\1\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
                              g,
                              count=1,
                          )
                      elif re.search(create_pat, g):
                          g = re.sub(
                              create_pat,
                              r'\1\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
                              g,
                              count=1,
                          )
                      else:
                          raise SystemExit('Kotlin release buildType not found')

                  # R8 + resource shrinker for Kotlin DSL.
                  release_pat = r'(getByName\("release"\)\s*\{|release\s*\{)'
                  if re.search(release_pat, g):
                      if 'isMinifyEnabled = true' not in g:
                          g = re.sub(release_pat, r'\1\n            isMinifyEnabled = true', g, count=1)
                      if 'isShrinkResources = true' not in g:
                          g = re.sub(release_pat, r'\1\n            isShrinkResources = true', g, count=1)

              gradle.write_text(g)
          PY

          echo "Prepared manifest:"
          grep -E "uses-permission|IncomingSmsReceiver|allowBackup|usesCleartextTraffic" android/app/src/main/AndroidManifest.xml || true
          echo "Prepared Android SDK / R8 configuration:"
          grep -R -E "compileSdk|proguardFiles" android/app/build.gradle* || true
          cat android/app/proguard-rules.pro || true
          echo "prepare_android=ok" >> "$RUNNER_TEMP/post-workflow-stages.log"

      - name: Configure optional release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "Stable release-signing secrets are not all configured; using the Flutter project's existing signing configuration."
            exit 0
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          groovy=Path('android/app/build.gradle')
          kotlin=Path('android/app/build.gradle.kts')
          if groovy.exists():
              s=groovy.read_text()
              if "keyProperties = new Properties()" not in s:
                  prefix="""def keyProperties = new Properties()\ndef keyPropertiesFile = rootProject.file('key.properties')\nif (keyPropertiesFile.exists()) {\n    keyProperties.load(new FileInputStream(keyPropertiesFile))\n}\n\n"""
                  s=prefix+s
              if 'signingConfigs {' not in s:
                  marker='    buildTypes {'
                  block="""    signingConfigs {\n        release {\n            keyAlias keyProperties['keyAlias']\n            keyPassword keyProperties['keyPassword']\n            storeFile keyProperties['storeFile'] ? file(keyProperties['storeFile']) : null\n            storePassword keyProperties['storePassword']\n        }\n    }\n\n"""
                  if marker not in s: raise SystemExit('Groovy buildTypes block not found')
                  s=s.replace(marker,block+marker,1)
              s=s.replace('signingConfig signingConfigs.debug','signingConfig signingConfigs.release')
              groovy.write_text(s)
          elif kotlin.exists():
              s=kotlin.read_text()
              if 'val keyProperties = Properties()' not in s:
                  prefix="""import java.util.Properties\nimport java.io.FileInputStream\n\nval keyProperties = Properties()\nval keyPropertiesFile = rootProject.file("key.properties")\nif (keyPropertiesFile.exists()) {\n    keyProperties.load(FileInputStream(keyPropertiesFile))\n}\n\n"""
                  s=prefix+s
              if 'create("release")' not in s:
                  marker='    buildTypes {'
                  block="""    signingConfigs {\n        create("release") {\n            keyAlias = keyProperties["keyAlias"] as String?\n            keyPassword = keyProperties["keyPassword"] as String?\n            storeFile = keyProperties["storeFile"]?.let { file(it) }\n            storePassword = keyProperties["storePassword"] as String?\n        }\n    }\n\n"""
                  if marker not in s: raise SystemExit('Kotlin buildTypes block not found')
                  s=s.replace(marker,block+marker,1)
              s=s.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("release")')
              kotlin.write_text(s)
          else:
              raise SystemExit('Android app Gradle file not found')
          PY

      - name: Flutter doctor
        shell: bash
        run: flutter doctor -v

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/flutter-pub-get.log"
          echo "flutter_pub_get=ok" >> "$RUNNER_TEMP/post-workflow-stages.log"

      - name: Analyze source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"
          echo "flutter_analyze=ok" >> "$RUNNER_TEMP/post-workflow-stages.log"

      - name: Build release APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter clean
          flutter pub get
          # Size-optimized direct APK:
          # - ARM64 only: removes duplicate native OCR/barcode libraries for other ABIs.
          # - Icon tree shaking enabled.
          # - Debug symbols are stored outside the APK.
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --tree-shake-icons \
            --split-debug-info=build/symbols \
            2>&1 | tee "$RUNNER_TEMP/flutter-build.log"
          echo "flutter_build_release_arm64=ok" >> "$RUNNER_TEMP/post-workflow-stages.log"

      - name: Collect exactly one APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf output_apk
          mkdir -p output_apk
          APK_PATH="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH="$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" -maxdepth 1 -type f -name '*.apk' -print -quit || true)"
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "APK not found."
            find "$PROJECT_DIR/build" -type f | head -n 150 || true
            exit 1
          fi
          cp "$APK_PATH" output_apk/post-management-v46.apk
          test "$(find output_apk -type f -name '*.apk' | wc -l)" -eq 1
          sha256sum output_apk/post-management-v46.apk | tee output_apk/SHA256.txt
          ls -lh output_apk/post-management-v46.apk

      - name: APK size report
        shell: bash
        run: |
          set -euo pipefail
          APK="output_apk/post-management-v46.apk"
          BYTES="$(stat -c%s "$APK")"
          MIB="$(awk -v b="$BYTES" 'BEGIN { printf "%.2f", b/1024/1024 }')"
          {
            echo "APK_SIZE_BYTES=$BYTES"
            echo "APK_SIZE_MIB=$MIB"
            echo
            echo "Largest files inside APK:"
            unzip -l "$APK" | awk 'NF>=4 && $1 ~ /^[0-9]+$/ {print $1, $4}' | sort -nr | head -n 30
            echo
            echo "Native ABI directories:"
            unzip -Z1 "$APK" | grep '^lib/' | cut -d/ -f2 | sort -u || true
          } | tee output_apk/SIZE_REPORT.txt

          # Guard against accidentally returning to a huge universal APK.
          if [ "$BYTES" -gt 125829120 ]; then
            echo "::error::Optimized APK is still larger than 120 MiB. Check SIZE_REPORT.txt before publishing."
            exit 1
          fi

      - name: Upload APK
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: post-management-apk
          path: |
            output_apk/post-management-v46.apk
            output_apk/SHA256.txt
            output_apk/SIZE_REPORT.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Delete previous successful APK artifacts
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ARTIFACT_ID: ${{ steps.upload_apk.outputs.artifact-id }}
        run: |
          set -uo pipefail
          IDS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name=="post-management-apk") | .id' 2>/dev/null || true)"
          while IFS= read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            [ "$artifact_id" = "${CURRENT_ARTIFACT_ID:-}" ] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
          done <<< "$IDS"

      - name: Collect versioned failure logs
        if: failure()
        shell: bash
        run: |
          set +e
          rm -rf failure_logs
          mkdir -p failure_logs

          VERSION_LINE=""
          VERSION_NAME="unknown"
          VERSION_CODE="unknown"

          if [ -n "${PROJECT_DIR:-}" ] && [ -f "${PROJECT_DIR:-}/pubspec.yaml" ]; then
            VERSION_LINE="$(grep -E '^[[:space:]]*version:[[:space:]]*' "$PROJECT_DIR/pubspec.yaml" | head -n 1 | sed -E 's/^[[:space:]]*version:[[:space:]]*//; s/[[:space:]]*$//' || true)"
          fi

          if [ -n "$VERSION_LINE" ]; then
            VERSION_NAME="${VERSION_LINE%%+*}"
            if [[ "$VERSION_LINE" == *"+"* ]]; then
              VERSION_CODE="${VERSION_LINE##*+}"
            else
              VERSION_CODE="$VERSION_NAME"
            fi
          fi

          SAFE_VERSION_CODE="$(printf '%s' "$VERSION_CODE" | tr -cd '0-9A-Za-z._-' | head -c 40)"
          [ -n "$SAFE_VERSION_CODE" ] || SAFE_VERSION_CODE="unknown"

          FAILURE_ARTIFACT_NAME="post-management-v${SAFE_VERSION_CODE}-run-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}-failure-logs"
          echo "FAILURE_ARTIFACT_NAME=$FAILURE_ARTIFACT_NAME" >> "$GITHUB_ENV"

          {
            echo "POST MANAGEMENT FAILURE DIAGNOSTICS"
            echo "=================================="
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "github_run_number=${GITHUB_RUN_NUMBER:-}"
            echo "github_run_id=${GITHUB_RUN_ID:-}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT:-}"
            echo "github_job=${GITHUB_JOB:-}"
            echo "git_ref=${GITHUB_REF:-}"
            echo "git_sha=${GITHUB_SHA:-}"
            echo "repository=${GITHUB_REPOSITORY:-}"
            echo "actor=${GITHUB_ACTOR:-}"
            echo "workflow=${GITHUB_WORKFLOW:-}"
            echo "generated_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "project_dir=${PROJECT_DIR:-}"
            echo "artifact_name=$FAILURE_ARTIFACT_NAME"
          } > failure_logs/01-build-info.txt 2>&1 || true

          cp "$RUNNER_TEMP/post-workflow-stages.log" failure_logs/02-workflow-stages.txt 2>/dev/null || true
          cp "$RUNNER_TEMP/flutter-pub-get.log" failure_logs/03-flutter-pub-get.log 2>/dev/null || true
          cp "$RUNNER_TEMP/flutter-analyze.log" failure_logs/04-flutter-analyze.log 2>/dev/null || true
          cp "$RUNNER_TEMP/flutter-build.log" failure_logs/05-flutter-build.log 2>/dev/null || true

          if [ -n "${PROJECT_DIR:-}" ] && [ -d "${PROJECT_DIR:-}" ]; then
            (cd "$PROJECT_DIR" && flutter doctor -v) > failure_logs/06-flutter-doctor.txt 2>&1 || true
          else
            flutter doctor -v > failure_logs/06-flutter-doctor.txt 2>&1 || true
          fi

          {
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            echo "SDK_ROOT=$SDK_ROOT"
            echo
            echo "--- platforms ---"
            ls -la "$SDK_ROOT/platforms" 2>&1 || true
            echo
            echo "--- build-tools ---"
            ls -la "$SDK_ROOT/build-tools" 2>&1 || true
          } > failure_logs/07-android-sdk.txt 2>&1 || true

          if [ -n "${PROJECT_DIR:-}" ] && [ -d "${PROJECT_DIR:-}" ]; then
            find "$PROJECT_DIR" -maxdepth 5 -type f \( \
              -name 'pubspec.yaml' -o \
              -name 'build.gradle' -o \
              -name 'build.gradle.kts' -o \
              -name 'AndroidManifest.xml' -o \
              -name 'proguard-rules.pro' \
            \) -print > failure_logs/08-project-files.txt 2>&1 || true

            if [ -f "$PROJECT_DIR/android/app/build.gradle" ]; then
              cp "$PROJECT_DIR/android/app/build.gradle" failure_logs/09-app-build.gradle 2>/dev/null || true
            elif [ -f "$PROJECT_DIR/android/app/build.gradle.kts" ]; then
              cp "$PROJECT_DIR/android/app/build.gradle.kts" failure_logs/09-app-build.gradle.kts 2>/dev/null || true
            fi

            if [ -f "$PROJECT_DIR/android/app/proguard-rules.pro" ]; then
              cp "$PROJECT_DIR/android/app/proguard-rules.pro" failure_logs/10-proguard-rules.pro 2>/dev/null || true
            fi

            if [ -f "$PROJECT_DIR/build/app/outputs/mapping/release/missing_rules.txt" ]; then
              cp "$PROJECT_DIR/build/app/outputs/mapping/release/missing_rules.txt" failure_logs/11-missing-rules.txt 2>/dev/null || true
            fi

            {
              echo "Flutter project directory:"
              echo "$PROJECT_DIR"
              echo
              echo "Top-level project files:"
              find "$PROJECT_DIR" -maxdepth 2 -type f -printf '%P\n' 2>/dev/null | sort | head -n 300
              echo
              echo "Android output files:"
              find "$PROJECT_DIR/build/app/outputs" -maxdepth 5 -type f -printf '%p\n' 2>/dev/null | sort | head -n 300 || true
            } > failure_logs/12-project-summary.txt 2>&1 || true
          fi

          {
            echo "Numbered diagnostic files:"
            find failure_logs -maxdepth 1 -type f -printf '%f\n' | sort
          } > failure_logs/13-file-index.txt 2>&1 || true

      - name: Upload versioned failure logs only on error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FAILURE_ARTIFACT_NAME }}
          path: failure_logs
          if-no-files-found: warn
          retention-days: 3
