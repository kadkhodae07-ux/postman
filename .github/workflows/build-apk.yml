name: Build Latest Postyar ZIP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: postyar-android-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/postyar-logs"
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Started (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$RUNNER_TEMP/postyar-logs/run-info.txt"

      - name: Select and extract latest source ZIP
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/postyar-logs/source-selection.log"
          SOURCE_DIR="$RUNNER_TEMP/postyar-source"

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          candidates_file="$RUNNER_TEMP/postyar-zip-candidates.tsv"
          : > "$candidates_file"

          while IFS= read -r -d '' zip_file; do
            zip_name="$(basename "$zip_file")"
            zip_name_lower="${zip_name,,}"

            case "$zip_name_lower" in
              *diagnostic*|*failure*|*error-log*|*logs*)
                continue
                ;;
            esac

            if ! unzip -Z1 "$zip_file" 2>/dev/null | grep -Eq '(^|/)pubspec\.yaml$'; then
              continue
            fi

            relative_path="${zip_file#"$GITHUB_WORKSPACE"/}"
            commit_time="$(git -C "$GITHUB_WORKSPACE" log -1 --format='%ct' -- "$relative_path" 2>/dev/null || true)"
            if [[ -z "$commit_time" ]]; then
              commit_time="$(stat -c '%Y' "$zip_file")"
            fi

            printf '%s\t%s\n' "$commit_time" "$zip_file" >> "$candidates_file"
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print0)

          latest_zip="$(sort -t $'\t' -k1,1nr -k2,2r "$candidates_file" | head -n 1 | cut -f 2-)"

          {
            echo 'Eligible Flutter source ZIP files:'
            if [[ -s "$candidates_file" ]]; then
              sort -t $'\t' -k1,1nr -k2,2r "$candidates_file"
            else
              echo '(none)'
            fi
          } | tee "$LOG"

          if [[ -z "${latest_zip:-}" ]]; then
            echo "No valid Flutter source ZIP containing pubspec.yaml was found in the repository root." | tee -a "$LOG"
            exit 1
          fi

          echo "Selected ZIP: $latest_zip" | tee -a "$LOG"
          unzip -t "$latest_zip" | tee -a "$LOG"
          unzip -q -o "$latest_zip" -d "$SOURCE_DIR"

          pubspec="$(find "$SOURCE_DIR" -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' \
            -not -path '*/build/*' \
            -print -quit)"

          if [[ -z "${pubspec:-}" ]]; then
            echo "No Flutter pubspec.yaml exists inside the selected ZIP." | tee -a "$LOG"
            find "$SOURCE_DIR" -maxdepth 4 -type f | sort | tee -a "$LOG"
            exit 1
          fi

          project_dir="$(dirname "$pubspec")"
          echo "Flutter project: $project_dir" | tee -a "$LOG"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "zip=$latest_zip" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Record build environment
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== Java ==='
            java -version
            echo
            echo '=== Flutter ==='
            flutter --version
            echo
            echo '=== Flutter doctor ==='
            flutter doctor -v
            echo
            echo '=== Gradle ==='
            gradle --version
          } 2>&1 | tee "$RUNNER_TEMP/postyar-logs/environment.log"

      - name: Prepare dependencies and OCR assets
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/postyar-logs/prepare.log"
          exec > >(tee -a "$LOG") 2>&1

          rm -rf build .dart_tool
          flutter clean

          if [[ -f tool/fetch_ocr_model.sh ]]; then
            chmod +x tool/fetch_ocr_model.sh
            ./tool/fetch_ocr_model.sh
          fi

          flutter pub get

      - name: Analyze source
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            2>&1 | tee "$RUNNER_TEMP/postyar-logs/analyze.log"

      - name: Build one release APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/postyar-logs/build.log"
          exec > >(tee -a "$LOG") 2>&1

          rm -rf build/app/outputs/flutter-apk
          flutter build apk --release

          apk="build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -s "$apk" ]]; then
            echo "Expected release APK was not created: $apk"
            find build/app/outputs -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi

          output_dir="$RUNNER_TEMP/postyar-output"
          rm -rf "$output_dir"
          mkdir -p "$output_dir"
          cp "$apk" "$output_dir/Postyar-release.apk"

          count="$(find "$output_dir" -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          if [[ "$count" != "1" ]]; then
            echo "Exactly one APK was expected, but $count files were found."
            find "$output_dir" -maxdepth 1 -type f -print
            exit 1
          fi

          sha256sum "$output_dir/Postyar-release.apk" \
            | tee "$RUNNER_TEMP/postyar-logs/apk-sha256.txt"

      - name: Delete previous Postyar build artifacts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const oldArtifacts = artifacts.filter((artifact) => {
              const name = artifact.name.toLowerCase();
              return name.startsWith('postyar-android') ||
                     name.startsWith('postyar-build-logs');
            });

            for (const artifact of oldArtifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              core.info(`Deleted old artifact: ${artifact.name} (${artifact.id})`);
            }

      - name: Upload the single APK
        uses: actions/upload-artifact@v4
        with:
          name: Postyar-Android
          path: ${{ runner.temp }}/postyar-output/Postyar-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Collect additional failure files
        if: failure() && steps.project.outcome == 'success'
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set +e
          diagnostics="$RUNNER_TEMP/postyar-logs/project-files"
          mkdir -p "$diagnostics"

          for file in \
            pubspec.yaml \
            pubspec.lock \
            analysis_options.yaml \
            android/gradle.properties \
            android/settings.gradle \
            android/build.gradle \
            android/app/build.gradle; do
            if [[ -f "$file" ]]; then
              mkdir -p "$diagnostics/$(dirname "$file")"
              cp "$file" "$diagnostics/$file"
            fi
          done

          if [[ -d build/app/outputs/logs ]]; then
            mkdir -p "$diagnostics/build/app/outputs"
            cp -R build/app/outputs/logs "$diagnostics/build/app/outputs/"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Postyar-Build-Logs-${{ github.run_number }}
          path: ${{ runner.temp }}/postyar-logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Postyar Android Build'
            echo
            echo "- Source ZIP: \`${{ steps.project.outputs.zip }}\`"
            echo "- Result: **${{ job.status }}**"
            if [[ "${{ job.status }}" == "success" ]]; then
              echo '- Output: `Postyar-Android` containing exactly one file: `Postyar-release.apk`'
              echo '- Previous Postyar build artifacts were deleted before uploading the new output.'
            else
              echo '- A diagnostics artifact named `Postyar-Build-Logs-*` was uploaded.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
